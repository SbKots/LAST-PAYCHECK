openapi: 3.0.3
info:
  title: LAST PAYCHECK Supabase API
  version: 2.0.1
  description: Текущий HTTPS-контракт Supabase. Все RPC используют JSON args и профиль
    lastpay_api. Закрытые lastpay/lastpay_private не экспонируются. provider_cache
    намеренно не включён в клиентский контракт. 24 исходные операции объединены в
    RPC и пять маршрутов providers; save_game/user_save добавляют приватную синхронизацию.
    Доменные и инфраструктурные ошибки имеют разные JSON-форматы.
servers:
- url: https://mmuytwyhdwttzxuredfm.supabase.co
  description: Существующий проект last-paycheck Frankfurt Free
security: &id001
- PublicKey: []
paths:
  /rest/v1/rpc/get_catalog:
    post:
      operationId: get_catalog
      summary: get_catalog
      description: Последняя опубликованная версия; запрос также учитывается в лимите
        чтений.
      tags:
      - Catalog
      security: *id001
      parameters: &id003
      - name: Content-Profile
        in: header
        required: true
        schema:
          type: string
          enum:
          - lastpay_api
      - &id015
        name: Accept-Profile
        in: header
        required: true
        schema:
          type: string
          enum:
          - lastpay_api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                args:
                  type: object
                  properties: {}
                  additionalProperties: false
              additionalProperties: false
              required:
              - args
      responses:
        '200':
          description: Успешный JSON ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manifest'
          headers:
            ETag:
              description: Strong revision validator including quotes. Pass through
                args.ifMatch; weak W/ is invalid.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: 'Revision responses: private, no-store, no-transform'
        '400':
          description: Неверный формат
          content:
            application/json:
              schema: &id002
                oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/PostgrestError'
        '401':
          description: Нет действительной сессии
          content:
            application/json:
              schema: *id002
        '403':
          description: Нет доступа
          content:
            application/json:
              schema: *id002
        '404':
          description: Не найдено
          content:
            application/json:
              schema: *id002
        '405':
          description: Метод не поддерживается
          content:
            application/json:
              schema: *id002
        '409':
          description: Конфликт данных или опубликованная версия
          content:
            application/json:
              schema: *id002
        '412':
          description: Устаревшая ревизия
          content:
            application/json:
              schema: *id002
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema: *id002
        '429':
          description: Лимит запросов
          content:
            application/json:
              schema: *id002
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema: *id002
        '503':
          description: Источник недоступен
          content:
            application/json:
              schema: *id002
