openapi: 3.0.3
info:
  title: LAST PAYCHECK Provider API
  version: 1.0.0
  description: Дополнение к контракту каталога. Лимит интеграций составляет 30 запросов в минуту с одного IP на экземпляр сервера. Неподдерживаемый метод существующего маршрута возвращает HTTP 405 с JSON Error (основной контракт), error.code = METHODNOTALLOWED.
servers:
  - url: http://127.0.0.1:8089/api/v1
security: []
paths:
  /integrations/worldbank/inflation:
    get:
      operationId: worldBankInflation
      summary: Инфляция по стране за период до десяти лет включительно
      parameters:
        - name: country
          in: query
          required: true
          schema: {type: string, pattern: '^[A-Z]{3}(?![\s\S])'}
          description: Код страны ISO 3166-1 alpha-3.
        - name: yearFrom
          in: query
          required: true
          schema: {type: integer, minimum: 1900, maximum: 2100}
        - name: yearTo
          in: query
          required: true
          schema: {type: integer, minimum: 1900, maximum: 2100}
      responses: &providerResponses
        '200': {$ref: '#/components/responses/ProviderData'}
        '400': {$ref: '../openapi.yaml#/components/responses/BadRequest'}
        '422': {$ref: '../openapi.yaml#/components/responses/ValidationError'}
        '429': {$ref: '../openapi.yaml#/components/responses/RateLimited'}
        '500': {$ref: '../openapi.yaml#/components/responses/InternalError'}
        '503': {$ref: '../openapi.yaml#/components/responses/Unavailable'}
  /integrations/onet/occupations:
    get:
      operationId: onetOccupations
      summary: Поиск складских профессий O*NET
      description: Серверу требуется ONET_API_KEY.
      responses: *providerResponses
  /integrations/onet/skills/{occupationCode}:
    get:
      operationId: onetSkills
      summary: Навыки профессии O*NET
      description: Серверу требуется ONET_API_KEY.
      parameters:
        - name: occupationCode
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9]{2}-[0-9]{4}\.[0-9]{2}(?![\s\S])'}
      responses: *providerResponses
  /integrations/cars/brands:
    get:
      operationId: carsBaseBrands
      summary: Страница марок CarsBase
      description: Серверу требуется CARS_API_TOKEN.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses: *providerResponses
  /integrations/cars/models:
    get:
      operationId: carsBaseModels
      summary: Страница моделей CarsBase
      description: Серверу требуется CARS_API_TOKEN.
      parameters:
        - name: brandId
          in: query
          schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}(?![\s\S])'}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses: *providerResponses
components:
  parameters:
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}
    PageSize:
      name: pageSize
      in: query
      schema: {type: integer, minimum: 1, maximum: 1000, default: 1000}
  responses:
    ProviderData:
      description: Данные провайдера. При сбое могут быть возвращены данные из просроченного кэша.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [provider, fromCache, stale, data]
            properties:
              provider: {type: string, enum: [WORLD_BANK, ONET, CARS_BASE]}
              fromCache: {type: boolean}
              stale: {type: boolean}
              providerFailure: {type: string, enum: [TIMEOUT, UNAVAILABLE, AUTH, INVALID, NO_DATA]}
              data:
                oneOf:
                  - type: object
                  - type: array
                    items: {}
