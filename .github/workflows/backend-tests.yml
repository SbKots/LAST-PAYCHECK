name: Backend tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test tools
        run: |
          python -m pip install -r server/scripts/requirements-test.txt
          npm install --prefix server/.local/newman --no-audit --no-fund newman@6.2.1
      - name: Migrate and run unit integration contract and Newman tests
        env:
          TEST_PG_PORT: '5432'
          TEST_PG_PASSWORD: ci-disposable-only
          TEST_API_PORT: '18111'
        run: python server/scripts/practice11.py --disposable-postgres
      - name: Upload safe test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          if-no-files-found: warn
          path: |
            server/build/reports/tests/test/
            server/build/test-results/test/TEST-*.xml
            server/.local/practice11-summary.json
            server/.local/newman-summary.json
            server/.local/negative-results.json
            server/.local/http-evidence.json
