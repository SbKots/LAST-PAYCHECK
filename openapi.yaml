components:
  securitySchemes:
    PublicKey:
      type: apiKey
      in: header
      name: apikey
      description: Only publishable/anon key; never service_role/secret
    UserJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SkillInput:
      type: object
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/Identifier'
        title:
          type: string
          minLength: 1
          maxLength: 160
          pattern: ^(?=[\s\S]*[^\u0009-\u000d\u001c-\u0020\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000])[^\u0000]*(?![\s\S])
        description:
          type: string
          maxLength: 4000
          pattern: ^[^\u0000]*(?![\s\S])
        source:
          type: string
          enum:
          - ONET
          - DEMO
        externalId:
          type: string
          nullable: true
          maxLength: 64
          pattern: ^[^\u0000]*(?![\s\S])
      required:
      - code
      - title
      - description
      - source
      - externalId
      oneOf:
      - properties:
          source:
            enum:
            - ONET
          externalId:
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^(?=[\s\S]*[^\u0009-\u000d\u001c-\u0020\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000])[^\u0000]*(?![\s\S])
      - properties:
          source:
            enum:
            - DEMO
    SkillCreate:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        code:
          $ref: '#/components/schemas/Identifier'
        title:
          type: string
          minLength: 1
          maxLength: 160
          pattern: ^(?=[\s\S]*[^\u0009-\u000d\u001c-\u0020\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000])[^\u0000]*(?![\s\S])
        description:
          type: string
          maxLength: 4000
          pattern: ^[^\u0000]*(?![\s\S])
        source:
          type: string
          enum:
          - ONET
          - DEMO
        externalId:
          type: string
          nullable: true
          maxLength: 64
          pattern: ^[^\u0000]*(?![\s\S])
      required:
      - id
      - code
      - title
      - description
      - source
      - externalId
      oneOf:
      - properties:
          source:
            enum:
            - ONET
          externalId:
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^(?=[\s\S]*[^\u0009-\u000d\u001c-\u0020\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000])[^\u0000]*(?![\s\S])
      - properties:
          source:
            enum:
            - DEMO
    Skill:
      $ref: '#/components/schemas/SkillCreate'
    Occupation:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 4000
        source:
          type: string
          enum:
          - ONET
          - DEMO
        externalId:
          type: string
          nullable: true
          maxLength: 64
        skills:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              skillId:
                $ref: '#/components/schemas/Identifier'
              importance:
                type: number
                minimum: 0
                maximum: 100
                nullable: true
                multipleOf: 0.01
            required:
            - skillId
            - importance
          maxItems: 1000
      required:
      - id
      - title
      - description
      - source
      - externalId
      - skills
    Job:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        occupationId:
          type: string
          nullable: true
          maxLength: 64
        requiredSkillId:
          $ref: '#/components/schemas/Identifier'
        title:
          type: string
          minLength: 1
          maxLength: 160
        requiredLevel:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        durationHours:
          type: number
          minimum: 0.01
          maximum: 24
          nullable: false
          multipleOf: 0.01
        basePayMinor:
          $ref: '#/components/schemas/Money'
        bonusCapMinor:
          $ref: '#/components/schemas/Money'
        taskPlan:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        extraEnergyPerHour:
          type: number
          minimum: 0
          maximum: 100
          nullable: false
          multipleOf: 0.01
        mechanic:
          type: string
          enum:
          - WAREHOUSE
      required:
      - id
      - occupationId
      - requiredSkillId
      - title
      - requiredLevel
      - durationHours
      - basePayMinor
      - bonusCapMinor
      - taskPlan
      - extraEnergyPerHour
      - mechanic
    InflationObservation:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        countryCode:
          type: string
          pattern: ^[A-Z]{3}(?![\s\S])
        year:
          type: integer
          format: int32
          minimum: 1900
          maximum: 2100
        indicatorCode:
          type: string
          enum:
          - FP.CPI.TOTL.ZG
        valuePercent:
          type: number
          minimum: -100
          exclusiveMinimum: true
          maximum: 999999.999999
          multipleOf: 1.0e-06
        source:
          type: string
          enum:
          - WORLD_BANK
          - DEMO
        fetchedAt:
          type: string
          format: date-time
      required:
      - id
      - countryCode
      - year
      - indicatorCode
      - valuePercent
      - source
      - fetchedAt
    CarBrand:
