name: Android checks

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Debug APK, run unit tests and check Kotlin formatting
        working-directory: android
        run: bash ./gradlew --no-daemon :app:assembleDebug testDebugUnitTest :domain:test ktlintCheck
